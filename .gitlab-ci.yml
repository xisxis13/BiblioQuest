stages:
  - build
  - update
  - deploy

build-azure:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG == "app"
      when: never
    - when: always
  image:
    name: hashicorp/terraform:1.7.5
    #desactive l'entrypoint de l'image terraform pour pouvoir executer commande shell
    entrypoint: [""]
  variables:               # <- le provider lira ces vars automatiquement
    ARM_CLIENT_ID: "$ARM_CLIENT_ID"
    ARM_CLIENT_SECRET: "$ARM_CLIENT_SECRET"
    ARM_TENANT_ID: "$ARM_TENANT_ID"
    ARM_SUBSCRIPTION_ID: "$ARM_SUBSCRIPTION_ID"
  before_script:
    - cd terraform
  script:
    - echo "Mise en place de l'infrastructure azure"
    #installe les providers avant de faire un apply
    - terraform init -input=false
    - terraform apply --auto-approve

    - echo "recuperation des variables..."
    # Récupération des outputs Terraform
    - export ACR_REGISTRY="$(terraform output -raw acr_login_server)"
    - export ACR_USERNAME="$(terraform output -raw acr_admin_username)"
    - export ACR_PASSWORD="$(terraform output -raw acr_admin_password_primary)"
    # Écriture dans le fichier dotenv pour les jobs suivants
    - echo "ACR_REGISTRY=$ACR_REGISTRY"   >  "$CI_PROJECT_DIR/acr.env"
    - echo "ACR_USERNAME=$ACR_USERNAME"  >> "$CI_PROJECT_DIR/acr.env"
    - echo "ACR_PASSWORD=$ACR_PASSWORD"  >> "$CI_PROJECT_DIR/acr.env"

  artifacts:
    reports:
      dotenv: acr.env
    expire_in: 1 week

docker_images_push:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG == "update_azure_images"
      when: never
    - when: always
  image: docker:27.1.1
  services:
    - name: docker:27.1.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # garde tes identifiants ACR en variables CI (ACR_USERNAME / ACR_PASSWORD)
    - echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
  script:
    - docker build -t "$ACR_REGISTRY/springapp:latest" books-teamB-spring
    - docker push "$ACR_REGISTRY/springapp:latest"
    - docker build -t "$ACR_REGISTRY/vuejsapp:latest" books-teamB-vue
    - docker push "$ACR_REGISTRY/vuejsapp:latest"